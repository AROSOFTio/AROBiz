name: arosoft
description: Free offline-first business document generator.
publish_to: none
version: 2.1.0+253
environment:
  sdk: ^3.11.1
dependencies:
  flutter:
    sdk: flutter
  pdf: ^3.12.0
  printing: ^5.14.3
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  http: ^1.6.0
  uuid: ^4.5.3
  image_picker: ^1.2.1
  image: ^4.5.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/crown_approved_hero.webp
    - assets/reference_icons/
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  min_sdk_android: 21
