name: Publish ARODesk privacy and deletion website
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'play-compliance/**'
      - '.github/workflows/privacy-pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: arodesk-privacy-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: play-compliance
      - id: deployment
        uses: actions/deploy-pages@v4
