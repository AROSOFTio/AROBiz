name: Show ARODesk APK on repository Releases
on:
  push:
    branches: [saas-offline-foundation]
    paths:
      - .github/workflows/promote-test-release.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Make existing test APK a visible published Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit arodesk-optimized-test-29 \
            --repo ${{ github.repository }} \
            --title "ARODesk Optimized Android APK - TEST BUILD #29 (20–24 MB)" \
            --notes "Optimized Android APKs for device evaluation ONLY. ARM64 is for most modern Android phones. This is not a completed SaaS release, not a signed Play Console AAB, and cloud authentication and offline sync are unfinished. Install APK only for internal evaluation." \
            --prerelease=false \
            --latest
