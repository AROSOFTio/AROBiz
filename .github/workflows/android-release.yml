name: Android release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'assets/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android-release.yml'
permissions:
  contents: write
concurrency:
  group: crown-business-docs-android
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Configure existing Android release signer
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          for var in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            if [ -z "${!var}" ]; then echo "::error::Missing required secret $var"; exit 1; fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > android/key.properties
      - name: Generate app icon and resolve packages
        run: |
          python3 -m pip install --break-system-packages --user "cairosvg>=2.7,<3" "Pillow>=10,<12"
          python3 tool/generate_brand_assets.py
          flutter pub get
          dart run flutter_launcher_icons
      - name: Analyze and test
        run: |
          flutter analyze --no-fatal-infos
          flutter test --reporter expanded
      - name: Build signed Android APK and AAB
        run: |
          BUILD_NUMBER=$((252 + GITHUB_RUN_NUMBER))
          flutter build apk --release --build-number="$BUILD_NUMBER"
          flutter build appbundle --release --build-number="$BUILD_NUMBER"
      - name: Verify release and package identity
        run: |
          set -euo pipefail
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/Crown-Business-Docs.apk
          cp build/app/outputs/bundle/release/app-release.aab release/Crown-Business-Docs.aab
          unzip -tq release/Crown-Business-Docs.apk
          unzip -tq release/Crown-Business-Docs.aab
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose release/Crown-Business-Docs.apk
          "$BUILD_TOOLS/aapt" dump badging release/Crown-Business-Docs.apk > /tmp/crown-docs-badging.txt
          grep -q "package: name='com.arosoft.arodesk'" /tmp/crown-docs-badging.txt
          grep -q "application-label:'Crown Business Docs'" /tmp/crown-docs-badging.txt
          jarsigner -verify release/Crown-Business-Docs.aab | grep -q 'jar verified'
          cd release
          sha256sum Crown-Business-Docs.apk Crown-Business-Docs.aab > SHA256SUMS.txt
      - name: Publish signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.0.$GITHUB_RUN_NUMBER"
          gh release create "$TAG" release/Crown-Business-Docs.apk release/Crown-Business-Docs.aab release/SHA256SUMS.txt --title "Crown Business Docs $TAG" --notes "Free offline business document generator. No required account, POS, inventory or cloud connection. Signed APK and Play Store AAB." --target "$GITHUB_SHA"
      - name: Remove transient signing files
        if: always()
        run: rm -f android/key.properties android/app/release.jks
