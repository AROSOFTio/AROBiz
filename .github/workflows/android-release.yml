name: Android release
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Check release configuration
        env:
          SUPABASE_URL: https://bqoutfgqfaangnnclgle.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          for var in SUPABASE_PUBLISHABLE_KEY ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            if [ -z "${!var}" ]; then echo "::error::Missing required secret $var"; exit 1; fi
          done
          # Supabase URL is public, not a secret. Keep it fixed to the verified ARODesk project.
          test "$SUPABASE_URL" = "https://bqoutfgqfaangnnclgle.supabase.co" || { echo "::error::Unexpected Supabase URL"; exit 1; }
          curl --fail --silent --show-error --retry 3 --max-time 15 -H "apikey: $SUPABASE_PUBLISHABLE_KEY" "$SUPABASE_URL/auth/v1/health" > /dev/null
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > android/key.properties
      - name: Fetch dependencies and analyze
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build signed APK and AAB with Supabase
        env:
          SUPABASE_URL: https://bqoutfgqfaangnnclgle.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build apk --release --build-number=${{ github.run_number }} --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          flutter build apk --release --split-per-abi --build-number=${{ github.run_number }} --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          flutter build appbundle --release --build-number=${{ github.run_number }} --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
      - name: Validate every APK, Android identity and signatures
        run: |
          set -euo pipefail
          OUT="build/app/outputs/flutter-apk"
          AAB="build/app/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          unzip -tq "$AAB"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          for apk in "$OUT/app-release.apk" "$OUT/app-arm64-v8a-release.apk" "$OUT/app-armeabi-v7a-release.apk" "$OUT/app-x86_64-release.apk"; do
            test -s "$apk"
            unzip -tq "$apk"
            "$BUILD_TOOLS/apksigner" verify --verbose "$apk"
            "$BUILD_TOOLS/aapt" dump badging "$apk" > /tmp/arodesk-badging.txt
            grep -q "package: name='com.arosoft.arodesk'" /tmp/arodesk-badging.txt
            grep -q "application-label:'ARODesk'" /tmp/arodesk-badging.txt
            echo "Verified $(basename "$apk"): $(stat -c%s "$apk") bytes"
          done
          unzip -l "$OUT/app-arm64-v8a-release.apk" | grep -q 'lib/arm64-v8a/libflutter.so'
          echo "All APKs and the AAB passed verification."
      - name: Generate download checksums
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-release.apk app-arm64-v8a-release.apk app-armeabi-v7a-release.apk app-x86_64-release.apk > "${GITHUB_WORKSPACE}/SHA256SUMS.txt"
          cd "${GITHUB_WORKSPACE}"
          sha256sum build/app/outputs/bundle/release/app-release.aab >> SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/app-x86_64-release.apk build/app/outputs/bundle/release/app-release.aab SHA256SUMS.txt --title "ARODesk $TAG" --notes "Signed ARODesk: ARM64 recommended for modern phones; universal APK also included. Verified package identity, signatures and checksums." --target "${{ github.sha }}"
