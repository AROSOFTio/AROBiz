name: Android release
on:
  workflow_dispatch:
  push:
    branches:
      - aropos-production
permissions:
  contents: write
jobs:
  release:
    runs-on: [self-hosted, Linux, X64, arobiz-android]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Configure dedicated VPS SDK
        run: |
          test -x /opt/arobiz-sdk/flutter/bin/flutter
          test -x /opt/arobiz-sdk/java/bin/java
          test -r /opt/arobiz-sdk/android/platforms/android-36/android.jar
          echo "JAVA_HOME=/opt/arobiz-sdk/java" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=/opt/arobiz-sdk/android" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/opt/arobiz-sdk/android" >> "$GITHUB_ENV"
          echo "/opt/arobiz-sdk/java/bin" >> "$GITHUB_PATH"
          echo "/opt/arobiz-sdk/flutter/bin" >> "$GITHUB_PATH"
          echo "/opt/arobiz-sdk/android/platform-tools" >> "$GITHUB_PATH"
      - name: Check release configuration
        env:
          SUPABASE_URL: https://bqoutfgqfaangnnclgle.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          for var in SUPABASE_PUBLISHABLE_KEY ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            if [ -z "${!var}" ]; then echo "::error::Missing required secret $var"; exit 1; fi
          done
          # Supabase URL is public, not a secret. Keep it fixed to the verified AroPOS project.
          test "$SUPABASE_URL" = "https://bqoutfgqfaangnnclgle.supabase.co" || { echo "::error::Unexpected Supabase URL"; exit 1; }
          curl --fail --silent --show-error --retry 3 --max-time 15 -H "apikey: $SUPABASE_PUBLISHABLE_KEY" "$SUPABASE_URL/auth/v1/health" > /dev/null
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > android/key.properties
      - name: Generate branded launcher and splash resources
        run: |
          python3 -m pip install --break-system-packages --user "cairosvg>=2.7,<3" "Pillow>=10,<12"
          python3 tool/generate_brand_assets.py
          flutter pub get
          dart run flutter_launcher_icons
      - name: Fetch dependencies and analyze
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Build signed APK and AAB with Supabase
        env:
          SUPABASE_URL: https://bqoutfgqfaangnnclgle.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build apk --release --build-name=3.0.0 --build-number=266 --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          flutter build apk --release --split-per-abi --build-name=3.0.0 --build-number=266 --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          flutter build appbundle --release --build-name=3.0.0 --build-number=266 --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
      - name: Validate every APK, Android identity and signatures
        run: |
          set -euo pipefail
          OUT="build/app/outputs/flutter-apk"
          AAB="build/app/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          unzip -tq "$AAB"
          jarsigner -verify "$AAB"
          test -n "$(unzip -Z1 "$AAB" | grep -E '^META-INF/[^/]+[.](RSA|DSA|EC)$')"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          for apk in "$OUT/app-release.apk" "$OUT/app-arm64-v8a-release.apk" "$OUT/app-armeabi-v7a-release.apk" "$OUT/app-x86_64-release.apk"; do
            test -s "$apk"
            unzip -tq "$apk"
            "$BUILD_TOOLS/apksigner" verify --verbose "$apk"
            "$BUILD_TOOLS/aapt" dump badging "$apk" > /tmp/arodesk-badging.txt
            grep -q "package: name='com.arosoft.arodesk'" /tmp/arodesk-badging.txt
            grep -Eq "targetSdkVersion:'(36|3[7-9]|[4-9][0-9])'" /tmp/arodesk-badging.txt || { echo '::error::Google Play requires target SDK >= 36'; exit 1; }
            grep -q "application-label:'AroPOS'" /tmp/arodesk-badging.txt
            grep -q "versionCode:'266'" /tmp/arodesk-badging.txt
            grep -q "versionName:'3.0.0'" /tmp/arodesk-badging.txt
            echo "Verified $(basename "$apk"): $(stat -c%s "$apk") bytes"
          done
          unzip -l "$OUT/app-arm64-v8a-release.apk" | grep -q 'lib/arm64-v8a/libflutter.so'
          echo "All APKs and the AAB passed verification."
      - name: Generate download checksums
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-release.apk app-arm64-v8a-release.apk app-armeabi-v7a-release.apk app-x86_64-release.apk > "${GITHUB_WORKSPACE}/SHA256SUMS.txt"
          cd "${GITHUB_WORKSPACE}"
          sha256sum build/app/outputs/bundle/release/app-release.aab >> SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="aropos-v3.0.0-266"
          gh release create "$TAG" --draft build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/app-x86_64-release.apk build/app/outputs/bundle/release/app-release.aab SHA256SUMS.txt --title "AroPOS $TAG" --notes "Signed AroPOS: ARM64 recommended for modern phones; universal APK also included. Verified package identity, signatures and checksums." --target "${{ github.sha }}"
      - name: Remove generated signing files
        if: always()
        run: rm -f android/key.properties android/app/release.jks
