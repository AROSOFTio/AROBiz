name: Android release
on:
  workflow_dispatch:
  push:
    branches:
      - aropos-web
permissions:
  contents: write
jobs:
  release:
    runs-on: [self-hosted, Linux, X64, arobiz-android]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Configure dedicated VPS SDK
        run: |
          test -x /opt/arobiz-sdk/flutter/bin/flutter
          test -x /opt/arobiz-sdk/java/bin/java
          test -r /opt/arobiz-sdk/android/platforms/android-36/android.jar
          echo "JAVA_HOME=/opt/arobiz-sdk/java" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=/opt/arobiz-sdk/android" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/opt/arobiz-sdk/android" >> "$GITHUB_ENV"
          echo "/opt/arobiz-sdk/java/bin" >> "$GITHUB_PATH"
          echo "/opt/arobiz-sdk/flutter/bin" >> "$GITHUB_PATH"
          echo "/opt/arobiz-sdk/android/platform-tools" >> "$GITHUB_PATH"
      - name: Check release configuration
        env:
          SUPABASE_URL: https://bqoutfgqfaangnnclgle.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          for var in SUPABASE_PUBLISHABLE_KEY ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            if [ -z "${!var}" ]; then echo "::error::Missing required secret $var"; exit 1; fi
          done
          # Supabase URL is public, not a secret. Keep it fixed to the verified AroPOS project.
          test "$SUPABASE_URL" = "https://bqoutfgqfaangnnclgle.supabase.co" || { echo "::error::Unexpected Supabase URL"; exit 1; }
          curl --fail --silent --show-error --retry 3 --max-time 15 -H "apikey: $SUPABASE_PUBLISHABLE_KEY" "$SUPABASE_URL/auth/v1/health" > /dev/null
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > android/key.properties
      - name: Generate branded launcher and splash resources
        run: |
          python3 -m pip install --break-system-packages --user "cairosvg>=2.7,<3" "Pillow>=10,<12"
          python3 tool/generate_brand_assets.py
          flutter pub get
          dart run flutter_launcher_icons
      - name: Fetch dependencies and analyze
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Build signed APK and AAB with Supabase
        env:
          SUPABASE_URL: https://bqoutfgqfaangnnclgle.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build apk --release --build-name=3.1.0 --build-number=267 --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          flutter build appbundle --release --build-name=3.1.0 --build-number=267 --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
      - name: Verify bundle, APK identity, signing continuity and archive integrity
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/app/outputs"
          OUT="$ROOT/flutter-apk"
          AAB="$ROOT/bundle/release/app-release.aab"
          TARGET="$GITHUB_SHA"
          work="$(mktemp -d "$RUNNER_TEMP/aropos-verify.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -s "$AAB"
          unzip -tq "$AAB"
          jarsigner -verify "$AAB" > "$work/jarsigner.txt" 2>&1
          grep -Fq 'jar verified.' "$work/jarsigner.txt" || { cat "$work/jarsigner.txt"; exit 1; }
          unzip -Z1 "$AAB" > "$work/aab-entries.txt"
          grep -Eq '^META-INF/[^/]+[.](RSA|DSA|EC)$' "$work/aab-entries.txt"
          curl --fail --location --silent --show-error --retry 3 --max-time 180 -o "$work/prior.apk" https://github.com/AROSOFTio/AROBiz/releases/download/v1.0.252/app-arm64-v8a-release.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs "$work/prior.apk" > "$work/prior-cert.txt"
          prior_fp="$(awk '/^Signer #1 certificate SHA-256 digest:/ {print tolower($NF)}' "$work/prior-cert.txt")"
          test "${#prior_fp}" -eq 64
          keytool -printcert -jarfile "$AAB" > "$work/aab-cert.txt"
          aab_fp="$(awk '/SHA256:/ {gsub(/:/,"",$2);print tolower($2);exit}' "$work/aab-cert.txt")"
          test "$aab_fp" = "$prior_fp" || { echo '::error::AAB signer differs from historical POS release'; exit 1; }
          curl --fail --location --silent --show-error --retry 3 --max-time 180 -o "$work/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          java -jar "$work/bundletool.jar" validate --bundle="$AAB"
          java -jar "$work/bundletool.jar" dump manifest --bundle="$AAB" > "$work/bundle-manifest.xml"
          python3 - "$work/bundle-manifest.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          a = '{http://schemas.android.com/apk/res/android}'
          assert root.get('package') == 'com.arosoft.arodesk', root.attrib
          assert root.get(a+'versionCode') == '267', root.attrib
          assert root.get(a+'versionName') == '3.1.0', root.attrib
          assert int(root.find('uses-sdk').get(a+'targetSdkVersion')) >= 36
          print('AAB package, version code, version name and target SDK verified.')
          PY
          for apk in "$OUT/app-release.apk"; do
            test -s "$apk"
            unzip -tq "$apk"
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$apk" > "$work/apk-cert.txt"
            cert="$(awk '/^Signer #1 certificate SHA-256 digest:/ {print tolower($NF)}' "$work/apk-cert.txt")"
            test "$cert" = "$prior_fp" || { echo '::error::APK signer mismatch'; exit 1; }
            "$BUILD_TOOLS/aapt" dump badging "$apk" > "$work/badging.txt"
            grep -E '^(package:|targetSdkVersion:|application-label:)' "$work/badging.txt"
            grep -Fq "package: name='com.arosoft.arodesk'" "$work/badging.txt"
            grep -Eq "targetSdkVersion:'(36|3[7-9]|[4-9][0-9])'" "$work/badging.txt"
            grep -Fq "application-label:'AroPOS'" "$work/badging.txt"
            grep -Fq "versionCode='267'" "$work/badging.txt"
            grep -Fq "versionName='3.1.0'" "$work/badging.txt"
            echo "Verified $(basename "$apk"): $(stat -c%s "$apk") bytes"
          done
          unzip -Z1 "$OUT/app-release.apk" > "$work/universal-entries.txt"
          grep -Fxq 'lib/arm64-v8a/libflutter.so' "$work/universal-entries.txt"
          release_dir="$(mktemp -d "$RUNNER_TEMP/aropos-assets.XXXXXX")"
          cp "$AAB" "$release_dir/AroPOS.aab"
          cp "$OUT/app-release.apk" "$release_dir/AroPOS.apk"
          (cd "$release_dir" && sha256sum AroPOS.aab AroPOS.apk > SHA256SUMS.txt)
          printf 'Source commit: %s\nVersion: 3.1.0 (267)\nPackage: com.arosoft.arodesk\nHistorical POS upload certificate SHA256: %s\n' "$TARGET" "$prior_fp" > "$release_dir/BUILD-VERIFICATION.txt"
          echo "RELEASE_DIR=$release_dir" >> "$GITHUB_ENV"
          echo "RELEASE_TARGET=$TARGET" >> "$GITHUB_ENV"
      - name: Publish verified candidate to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create aropos-v3.1.0-267 "$RELEASE_DIR/AroPOS.aab" "$RELEASE_DIR/AroPOS.apk" "$RELEASE_DIR/SHA256SUMS.txt" "$RELEASE_DIR/BUILD-VERIFICATION.txt" --repo "$GITHUB_REPOSITORY" --prerelease --title 'AroPOS 3.1.0 (267)' --notes 'Verified signed Android release candidate. Package and signer match historical POS release; APK and AAB identities validated. Complete device and Play Console acceptance checks before production submission.' --target "$RELEASE_TARGET"
          echo 'Verified candidate published to GitHub Releases.'
      - name: Remove generated signing files
        if: always()
        run: rm -f android/key.properties android/app/release.jks
