name: Android smoke build (APK)
on:
  push:
    branches: [saas-offline-foundation]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build APK for device testing
        run: flutter build apk --debug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: arodesk-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Publish direct APK download under Releases (pre-release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk ARODesk-Android-TEST.apk
          gh release create "arodesk-test-${{ github.run_number }}" ARODesk-Android-TEST.apk \
            --target "${{ github.sha }}" \
            --title "ARODesk Android Test Build #${{ github.run_number }}" \
            --notes "TEST ONLY. Offline local prototype. Cloud SaaS login, database migration, synchronization, release signing and production security verification are NOT complete. Do not distribute to customers or upload to Google Play." \
            --prerelease
