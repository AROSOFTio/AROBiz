name: AroPOS web compatibility
on:
  push:
    branches: [aropos-web]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  web:
    runs-on: [self-hosted, Linux, X64, arobiz-android]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure Flutter
        run: |
          test -x /opt/arobiz-sdk/flutter/bin/flutter
          echo "/opt/arobiz-sdk/flutter/bin" >> "$GITHUB_PATH"
      - name: Analyze, test and compile web
        env:
          SUPABASE_URL: https://bqoutfgqfaangnnclgle.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
          flutter build web --release --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          test -s build/web/index.html
          test -s build/web/main.dart.js
      - name: Publish compiled web bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tar -czf AroPOS-web.tar.gz -C build/web .
          sha256sum AroPOS-web.tar.gz > WEB-SHA256SUMS.txt
          gh release create "aropos-web-267-${GITHUB_RUN_NUMBER}" AroPOS-web.tar.gz WEB-SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --prerelease --title "AroPOS web build 267" --notes "Compiled web candidate; browser and deployment checks required." --target "$GITHUB_SHA"
